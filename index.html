<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <title>QR Generator</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ink: #111827;
        --muted: #667085;
        --line: #d9deea;
        --page: #f4f7fb;
        --panel: #ffffff;
        --accent: #4f46e5;
        --accent-dark: #3730a3;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 80% -10%, #e0e7ff 0, transparent 28rem), var(--page);
        color: var(--ink);
      }

      main {
        width: min(100% - 32px, 1040px);
        margin: 0 auto;
        padding: 52px 0;
      }

      header { margin-bottom: 30px; }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 720px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        letter-spacing: -0.055em;
        line-height: 1;
      }

      header > p:not(.eyebrow) { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin: 14px 0 0; }

      .workspace {
        display: grid;
        grid-template-columns: minmax(270px, 0.88fr) minmax(300px, 1.12fr);
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 24px 64px rgb(15 23 42 / 0.08);
      }

      .controls { padding: 28px; border-right: 1px solid var(--line); }
      .controls h2 { font-size: 1.05rem; margin: 0 0 22px; }
      .field { display: grid; gap: 8px; margin-top: 18px; }
      .field:first-of-type { margin-top: 0; }
      label, .field > span { font-size: 0.84rem; font-weight: 700; }
      textarea, select, input[type="color"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: inherit;
        font: inherit;
      }
      textarea { min-height: 106px; padding: 12px; line-height: 1.4; resize: vertical; }
      select { min-height: 44px; padding: 0 10px; }
      input[type="color"] { height: 44px; padding: 5px; cursor: pointer; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .range-line { display: grid; grid-template-columns: 1fr 52px; align-items: center; gap: 12px; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      output { color: var(--muted); font-size: 0.88rem; text-align: right; }

      .preview {
        display: grid;
        min-height: 480px;
        place-items: center;
        padding: 28px;
        background: linear-gradient(145deg, #f8faff, #eef2ff);
      }
      .preview-inner { display: grid; justify-items: center; gap: 22px; width: min(100%, 390px); }
      #qr {
        display: grid;
        width: 100%;
        min-height: 260px;
        place-items: center;
        padding: 20px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgb(67 56 202 / 0.14);
      }
      #qr svg { display: block; width: 100%; height: auto; }
      button {
        width: 100%;
        min-height: 46px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
      }
      button:hover { background: var(--accent-dark); }
      .hint { color: var(--muted); font-size: 0.8rem; line-height: 1.5; text-align: center; }

      @media (max-width: 700px) {
        main { width: min(100% - 24px, 1040px); padding: 32px 0; }
        .workspace { grid-template-columns: 1fr; }
        .controls { border-right: 0; border-bottom: 1px solid var(--line); }
        .preview { min-height: 380px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">QR Generator</p>
        <h1>Turn any link or text into a QR code.</h1>
        <p>Generate a crisp, customizable QR code entirely in your browser. Nothing you enter is sent to a server.</p>
      </header>

      <section class="workspace" aria-label="QR code generator">
        <div class="controls">
          <h2>Customize</h2>
          <label class="field" for="content">
            <span>Link or text</span>
            <textarea id="content" autocomplete="off" spellcheck="false">https://unlikeotherai.com</textarea>
          </label>
          <div class="row">
            <label class="field" for="color">
              <span>Code color</span>
              <input id="color" type="color" value="#111827" />
            </label>
            <label class="field" for="shape">
              <span>Style</span>
              <select id="shape">
                <option value="square">Rounded squares</option>
                <option value="dot">Dots</option>
              </select>
            </label>
          </div>
          <label class="field" for="size">
            <span>Size</span>
            <span class="range-line">
              <input id="size" type="range" min="160" max="1024" step="16" value="512" />
              <output id="sizeValue" for="size">512</output>
            </span>
          </label>
        </div>
        <div class="preview">
          <div class="preview-inner">
            <div id="qr" aria-live="polite"></div>
            <button id="download" type="button">Download SVG</button>
            <div class="hint">SVG stays sharp at any size, whether you print it or use it online.</div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import { createStyledQRCode } from "./dist/index.js";

      const elements = {
        color: document.querySelector("#color"),
        content: document.querySelector("#content"),
        download: document.querySelector("#download"),
        qr: document.querySelector("#qr"),
        shape: document.querySelector("#shape"),
        size: document.querySelector("#size"),
        sizeValue: document.querySelector("#sizeValue"),
      };
      let currentSvg = "";

      function render() {
        const size = Number(elements.size.value);
        const content = elements.content.value.trim() || " ";

        elements.sizeValue.textContent = String(size);
        currentSvg = createStyledQRCode(content, {
          backgroundColor: "#ffffff",
          color: elements.color.value,
          cornerRadius: elements.shape.value === "dot" ? 0 : 0.28,
          errorCorrectionLevel: "M",
          shape: elements.shape.value,
          size,
        }).toSvg();
        elements.qr.innerHTML = currentSvg;
      }

      function download() {
        const blob = new Blob([currentSvg], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = "qr-code.svg";
        anchor.click();
        URL.revokeObjectURL(url);
      }

      for (const element of [elements.content, elements.color, elements.shape, elements.size]) {
        element.addEventListener("input", render);
      }
      elements.download.addEventListener("click", download);
      render();
    </script>
  </body>
</html>
