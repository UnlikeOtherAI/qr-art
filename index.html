<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <title>QR Generator</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --ink: #121826; --muted: #667085; --line: #d9deea; --page: #f4f7fb; --panel: #fff; --accent: #5147e7; --accent-dark: #3830b8; --error: #b42318; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 80% -10%, #e0e7ff 0, transparent 28rem), var(--page); color: var(--ink); }
      main { width: min(100% - 32px, 1080px); margin: 0 auto; padding: 52px 0; }
      header { margin-bottom: 30px; }
      .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      h1 { margin: 0; max-width: 720px; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -.055em; line-height: 1; }
      header > p:not(.eyebrow) { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin: 14px 0 0; }
      .workspace { display: grid; grid-template-columns: minmax(300px, .95fr) minmax(340px, 1.05fr); overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 24px 64px rgb(15 23 42 / .08); }
      .controls { padding: 28px; border-right: 1px solid var(--line); }
      .controls h2 { font-size: 1.05rem; margin: 0 0 22px; }
      .field { display: grid; gap: 8px; margin-top: 18px; }
      .field:first-of-type { margin-top: 0; }
      label, .field > span, .field-label { font-size: .84rem; font-weight: 700; }
      textarea, select, input[type="color"], input[type="email"], input[type="password"], input[type="tel"], input[type="text"], input[type="url"] { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: inherit; font: inherit; }
      textarea { min-height: 96px; padding: 12px; line-height: 1.4; resize: vertical; }
      select, input[type="email"], input[type="password"], input[type="tel"], input[type="text"], input[type="url"] { min-height: 44px; padding: 0 10px; }
      input[type="color"] { height: 44px; padding: 5px; cursor: pointer; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .type-fields { display: grid; gap: 14px; }
      .type-fields .field { margin-top: 0; }
      .range-line { display: grid; grid-template-columns: 1fr 56px; align-items: center; gap: 12px; }
      output { color: var(--muted); font-size: .88rem; text-align: right; }
      .logo-controls { display: grid; gap: 12px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
      .upload { display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px dashed #aeb8d2; border-radius: 10px; color: var(--accent); cursor: pointer; font-size: .88rem; font-weight: 750; }
      .upload:hover { border-color: var(--accent); background: #f7f6ff; }
      .upload input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
      .logo-status { min-height: 1.2em; color: var(--muted); font-size: .78rem; }
      [hidden] { display: none !important; }
      .preview { display: grid; min-height: 570px; place-items: center; padding: 28px; background: linear-gradient(145deg, #f8faff, #eef2ff); }
      .preview-inner { display: grid; justify-items: center; gap: 22px; width: min(100%, 390px); }
      #qr { display: grid; width: 100%; min-height: 280px; place-items: center; padding: 20px; background: #fff; border-radius: 16px; box-shadow: 0 12px 30px rgb(67 56 202 / .14); }
      #qr svg { display: block; width: 100%; height: auto; }
      .download-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
      .render-error { color: var(--error); font-size: .9rem; line-height: 1.5; text-align: center; }
      button { width: 100%; min-height: 46px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; font: inherit; font-weight: 800; }
      button:hover:not(:disabled) { background: var(--accent-dark); }
      button:disabled { cursor: not-allowed; opacity: .55; }
      .hint { color: var(--muted); font-size: .8rem; line-height: 1.5; text-align: center; }
      @media (max-width: 760px) { main { width: min(100% - 24px, 1080px); padding: 32px 0; } .workspace { grid-template-columns: 1fr; } .controls { border-right: 0; border-bottom: 1px solid var(--line); } .preview { min-height: 410px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">QR Generator</p>
        <h1>Turn any link or text into a QR code.</h1>
        <p>Generate a crisp, customizable QR code entirely in your browser. Nothing you enter or upload is sent to a server.</p>
      </header>
      <section class="workspace" aria-label="QR code generator">
        <div class="controls">
          <h2>Customize</h2>
          <label class="field" for="contentType"><span>QR content type</span><select id="contentType"><option value="url">Website URL</option><option value="text">Plain text</option><option value="wifi">Wi-Fi network</option><option value="email">Email</option><option value="phone">Phone number</option><option value="sms">SMS message</option></select></label>
          <label id="contentField" class="field" for="content"><span id="contentLabel">Website URL</span><textarea id="content" autocomplete="off" spellcheck="false" placeholder="https://example.com">https://unlikeotherai.com</textarea></label>
          <div id="wifiFields" class="type-fields" hidden>
            <label class="field" for="wifiSsid"><span>Network name (SSID)</span><input id="wifiSsid" type="text" autocomplete="off" /></label>
            <div class="row"><label class="field" for="wifiSecurity"><span>Security</span><select id="wifiSecurity"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">No password</option></select></label><label class="field" for="wifiPassword"><span>Network password</span><input id="wifiPassword" type="password" autocomplete="off" /></label></div>
          </div>
          <div id="emailFields" class="type-fields" hidden>
            <label class="field" for="emailTo"><span>Email address</span><input id="emailTo" type="email" autocomplete="off" /></label>
            <label class="field" for="emailSubject"><span>Subject</span><input id="emailSubject" type="text" autocomplete="off" /></label>
            <label class="field" for="emailBody"><span>Message</span><textarea id="emailBody" autocomplete="off" spellcheck="true"></textarea></label>
          </div>
          <div id="phoneFields" class="type-fields" hidden><label class="field" for="phoneNumber"><span>Phone number</span><input id="phoneNumber" type="tel" autocomplete="tel" /></label></div>
          <div id="smsFields" class="type-fields" hidden><label class="field" for="smsNumber"><span>Phone number</span><input id="smsNumber" type="tel" autocomplete="tel" /></label><label class="field" for="smsMessage"><span>Message</span><textarea id="smsMessage" autocomplete="off" spellcheck="true"></textarea></label></div>
          <div class="row">
            <label class="field" for="colorMode"><span>Code colour</span><select id="colorMode"><option value="solid">Solid</option><option value="rainbow">Rainbow</option></select></label>
            <label id="codeColorField" class="field" for="color"><span>Solid colour</span><input id="color" type="color" value="#121826" /></label>
          </div>
          <div class="row">
            <label class="field" for="style"><span>Module style</span><select id="style"><option value="rounded">Rounded squares</option><option value="square">Sharp squares</option><option value="dot">Dots</option></select></label>
            <label id="cornerRadiusField" class="field" for="cornerRadius"><span>Corner radius</span><span class="range-line"><input id="cornerRadius" type="range" min="0" max="100" step="1" value="28" /><output id="cornerRadiusValue" for="cornerRadius">28%</output></span></label>
          </div>
          <label class="field" for="size"><span>Size</span><span class="range-line"><input id="size" type="range" min="160" max="1024" step="16" value="512" /><output id="sizeValue" for="size">512</output></span></label>
          <div class="logo-controls">
            <span class="field-label">Centre logo</span>
            <label class="upload" for="logoFile"><span>Upload logo</span><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" /></label>
            <span id="logoStatus" class="logo-status">No logo selected</span>
            <div id="logoOptions" class="row" hidden>
              <label class="field" for="logoColorMode"><span>Logo colour</span><select id="logoColorMode"><option value="original">Original</option><option value="single">Single colour</option></select></label>
              <label id="logoColorField" class="field" for="logoColor" hidden><span>Single colour</span><input id="logoColor" type="color" value="#121826" /></label>
            </div>
          </div>
        </div>
        <div class="preview"><div class="preview-inner"><div id="qr" aria-live="polite"></div><div class="download-actions"><button id="download" type="button">Download SVG</button><button id="downloadPng" type="button">Download PNG</button></div><div class="hint">The logo is scaled into a clear centre frame to keep the code easy to scan.</div></div></div>
      </section>
    </main>
    <script type="module">
      import { createStyledQRCode, makeLogoBackgroundTransparent } from "./dist/index.js?version=__BUILD_VERSION__";

      const elements = {
        codeColorField: document.querySelector("#codeColorField"), color: document.querySelector("#color"), colorMode: document.querySelector("#colorMode"), content: document.querySelector("#content"), contentField: document.querySelector("#contentField"), contentLabel: document.querySelector("#contentLabel"), contentType: document.querySelector("#contentType"), cornerRadius: document.querySelector("#cornerRadius"), cornerRadiusField: document.querySelector("#cornerRadiusField"), cornerRadiusValue: document.querySelector("#cornerRadiusValue"), download: document.querySelector("#download"), downloadPng: document.querySelector("#downloadPng"), emailBody: document.querySelector("#emailBody"), emailFields: document.querySelector("#emailFields"), emailSubject: document.querySelector("#emailSubject"), emailTo: document.querySelector("#emailTo"), logoColor: document.querySelector("#logoColor"), logoColorField: document.querySelector("#logoColorField"), logoColorMode: document.querySelector("#logoColorMode"), logoFile: document.querySelector("#logoFile"), logoOptions: document.querySelector("#logoOptions"), logoStatus: document.querySelector("#logoStatus"), phoneFields: document.querySelector("#phoneFields"), phoneNumber: document.querySelector("#phoneNumber"), qr: document.querySelector("#qr"), size: document.querySelector("#size"), sizeValue: document.querySelector("#sizeValue"), smsFields: document.querySelector("#smsFields"), smsMessage: document.querySelector("#smsMessage"), smsNumber: document.querySelector("#smsNumber"), style: document.querySelector("#style"), wifiFields: document.querySelector("#wifiFields"), wifiPassword: document.querySelector("#wifiPassword"), wifiSecurity: document.querySelector("#wifiSecurity"), wifiSsid: document.querySelector("#wifiSsid"),
      };
      let currentSvg = "";
      let logoFile;
      let logoSource;
      let logoRequest = 0;
      const formStorageKey = "qr-generator-form-v1";
      const localStateCookie = "qr-generator-local-state";
      const logoDatabaseName = "qr-generator-local-assets";
      const logoStoreName = "assets";

      const typeDetails = {
        url: { label: "Website URL", placeholder: "https://example.com" },
        text: { label: "Plain text", placeholder: "Write any text" },
      };

      function setLocalStateMarker() {
        document.cookie = `${localStateCookie}=1; Max-Age=31536000; Path=/; SameSite=Lax; Secure`;
      }

      function formState() {
        return {
          color: elements.color.value, colorMode: elements.colorMode.value, content: elements.content.value, contentType: elements.contentType.value, cornerRadius: elements.cornerRadius.value, emailBody: elements.emailBody.value, emailSubject: elements.emailSubject.value, emailTo: elements.emailTo.value, logoColor: elements.logoColor.value, logoColorMode: elements.logoColorMode.value, phoneNumber: elements.phoneNumber.value, size: elements.size.value, smsMessage: elements.smsMessage.value, smsNumber: elements.smsNumber.value, style: elements.style.value, wifiPassword: elements.wifiPassword.value, wifiSecurity: elements.wifiSecurity.value, wifiSsid: elements.wifiSsid.value,
        };
      }

      function persistFormState() {
        try {
          localStorage.setItem(formStorageKey, JSON.stringify(formState()));
          setLocalStateMarker();
        } catch { /* Browsers can disable local storage; the generator still works without persistence. */ }
      }

      function restoreFormState() {
        try {
          const saved = JSON.parse(localStorage.getItem(formStorageKey) || "null");
          if (!saved || typeof saved !== "object") return;
          for (const [key, element] of Object.entries({ color: elements.color, colorMode: elements.colorMode, content: elements.content, contentType: elements.contentType, cornerRadius: elements.cornerRadius, emailBody: elements.emailBody, emailSubject: elements.emailSubject, emailTo: elements.emailTo, logoColor: elements.logoColor, logoColorMode: elements.logoColorMode, phoneNumber: elements.phoneNumber, size: elements.size, smsMessage: elements.smsMessage, smsNumber: elements.smsNumber, style: elements.style, wifiPassword: elements.wifiPassword, wifiSecurity: elements.wifiSecurity, wifiSsid: elements.wifiSsid })) {
            if (typeof saved[key] === "string") element.value = saved[key];
          }
        } catch { /* Ignore malformed or unavailable browser storage. */ }
      }

      function openLogoDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(logoDatabaseName, 1);
          request.addEventListener("upgradeneeded", () => request.result.createObjectStore(logoStoreName));
          request.addEventListener("success", () => resolve(request.result));
          request.addEventListener("error", () => reject(request.error));
        });
      }

      function requestValue(request) {
        return new Promise((resolve, reject) => {
          request.addEventListener("success", () => resolve(request.result));
          request.addEventListener("error", () => reject(request.error));
        });
      }

      function transactionComplete(transaction) {
        return new Promise((resolve, reject) => {
          transaction.addEventListener("complete", resolve);
          transaction.addEventListener("error", () => reject(transaction.error));
          transaction.addEventListener("abort", () => reject(transaction.error));
        });
      }

      async function persistLogo(file) {
        try {
          const database = await openLogoDatabase();
          const transaction = database.transaction(logoStoreName, "readwrite");
          const store = transaction.objectStore(logoStoreName);
          if (file) store.put({ file, name: file.name }, "current"); else store.delete("current");
          await transactionComplete(transaction);
          database.close();
        } catch { /* A logo is optional, so persistence failures must not block generation. */ }
      }

      async function restoreLogo() {
        try {
          const database = await openLogoDatabase();
          const transaction = database.transaction(logoStoreName, "readonly");
          const saved = await requestValue(transaction.objectStore(logoStoreName).get("current"));
          database.close();
          if (!saved?.file || !(saved.file instanceof Blob)) return;
          logoFile = saved.file instanceof File ? saved.file : new File([saved.file], saved.name || "saved-logo", { type: saved.file.type });
          refreshLogo();
        } catch { /* No stored logo is a valid initial state. */ }
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.addEventListener("load", () => typeof reader.result === "string" ? resolve(reader.result) : reject(new Error("The logo could not be read.")));
          reader.addEventListener("error", () => reject(new Error("The logo could not be read.")));
          reader.readAsDataURL(file);
        });
      }

      async function tintLogo(source, color) {
        const image = new Image();
        image.src = source;
        await image.decode();
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        if (!context) throw new Error("The browser could not prepare the logo.");
        canvas.width = image.naturalWidth || image.width;
        canvas.height = image.naturalHeight || image.height;
        context.drawImage(image, 0, 0);
        context.globalCompositeOperation = "source-in";
        context.fillStyle = color;
        context.fillRect(0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/png");
      }

      async function refreshLogo() {
        const request = ++logoRequest;
        if (!logoFile) { logoSource = undefined; render(); return; }
        elements.logoStatus.textContent = "Preparing logo…";
        try {
          const original = await readFileAsDataUrl(logoFile);
          const nextSource = elements.logoColorMode.value === "single"
            ? await tintLogo(await makeLogoBackgroundTransparent(logoFile, { color: "#ffffff", tolerance: 44 }), elements.logoColor.value)
            : original;
          if (request !== logoRequest) return;
          logoSource = nextSource;
          elements.logoStatus.textContent = logoFile.name;
          render();
        } catch (error) {
          if (request !== logoRequest) return;
          logoSource = undefined;
          elements.logoStatus.textContent = error instanceof Error ? error.message : "The logo could not be prepared.";
          render();
        }
      }

      function updateControlVisibility() {
        const contentType = elements.contentType.value;
        const details = typeDetails[contentType];
        elements.contentField.hidden = !details;
        elements.wifiFields.hidden = contentType !== "wifi";
        elements.emailFields.hidden = contentType !== "email";
        elements.phoneFields.hidden = contentType !== "phone";
        elements.smsFields.hidden = contentType !== "sms";
        if (details) {
          elements.contentLabel.textContent = details.label;
          elements.content.placeholder = details.placeholder;
        }
        elements.codeColorField.hidden = elements.colorMode.value === "rainbow";
        elements.logoOptions.hidden = !logoFile;
        elements.logoColorField.hidden = !logoFile || elements.logoColorMode.value !== "single";
        elements.cornerRadiusValue.textContent = `${elements.cornerRadius.value}%`;
        elements.sizeValue.textContent = elements.size.value;
      }

      function escapedWifiValue(value) {
        return value.replace(/([\\;,:])/g, "\\$1");
      }

      function contentForQRCode() {
        switch (elements.contentType.value) {
          case "wifi": {
            const ssid = elements.wifiSsid.value.trim();
            if (!ssid) throw new Error("Enter the Wi-Fi network name.");
            const security = elements.wifiSecurity.value;
            const password = elements.wifiPassword.value;
            return `WIFI:T:${security};S:${escapedWifiValue(ssid)};${security === "nopass" ? "" : `P:${escapedWifiValue(password)};`};`;
          }
          case "email": {
            const address = elements.emailTo.value.trim();
            if (!address) throw new Error("Enter an email address.");
            const parameters = new URLSearchParams();
            if (elements.emailSubject.value) parameters.set("subject", elements.emailSubject.value);
            if (elements.emailBody.value) parameters.set("body", elements.emailBody.value);
            const query = parameters.toString();
            return `mailto:${encodeURIComponent(address)}${query ? `?${query}` : ""}`;
          }
          case "phone": {
            const number = elements.phoneNumber.value.trim();
            if (!number) throw new Error("Enter a phone number.");
            return `tel:${number}`;
          }
          case "sms": {
            const number = elements.smsNumber.value.trim();
            if (!number) throw new Error("Enter a phone number.");
            return `SMSTO:${number}:${elements.smsMessage.value}`;
          }
          default: {
            const content = elements.content.value.trim();
            if (!content) throw new Error(elements.contentType.value === "url" ? "Enter a website URL." : "Enter some text.");
            return content;
          }
        }
      }

      function render() {
        updateControlVisibility();
        try {
          const content = contentForQRCode();
          const dots = Number(elements.cornerRadius.value) === 100;
          currentSvg = createStyledQRCode(content, {
            backgroundColor: "#ffffff", color: elements.color.value, cornerRadius: dots ? 0 : Number(elements.cornerRadius.value) / 100, errorCorrectionLevel: logoSource ? "H" : "M",
            logo: logoSource ? { backgroundColor: "#ffffff", borderRadius: 18, padding: 12, sizeRatio: 0.22, src: logoSource } : undefined,
            mask: elements.colorMode.value === "rainbow" ? { direction: "diagonal", preset: "rainbow" } : undefined,
            shape: dots ? "dot" : "square", size: Number(elements.size.value),
          }).toSvg();
          elements.qr.innerHTML = currentSvg;
          elements.download.disabled = false;
          elements.downloadPng.disabled = false;
        } catch (error) {
          currentSvg = "";
          elements.qr.innerHTML = `<p class="render-error">${error instanceof Error ? error.message : "The QR code could not be generated."}</p>`;
          elements.download.disabled = true;
          elements.downloadPng.disabled = true;
        }
      }

      function downloadSvg() {
        const blob = new Blob([currentSvg], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = "qr-code.svg";
        anchor.click();
        URL.revokeObjectURL(url);
      }

      async function downloadPng() {
        const svgBlob = new Blob([currentSvg], { type: "image/svg+xml" });
        const svgUrl = URL.createObjectURL(svgBlob);
        try {
          const image = new Image();
          image.src = svgUrl;
          await image.decode();
          const canvas = document.createElement("canvas");
          const size = Number(elements.size.value);
          canvas.width = size;
          canvas.height = size;
          const context = canvas.getContext("2d");
          if (!context) throw new Error("The browser could not create a PNG.");
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, size, size);
          context.drawImage(image, 0, 0, size, size);
          const png = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
          if (!png) throw new Error("The browser could not create a PNG.");
          const pngUrl = URL.createObjectURL(png);
          const anchor = document.createElement("a");
          anchor.href = pngUrl;
          anchor.download = "qr-code.png";
          anchor.click();
          URL.revokeObjectURL(pngUrl);
        } finally {
          URL.revokeObjectURL(svgUrl);
        }
      }

      function syncStyleFromRadius() {
        const radius = Number(elements.cornerRadius.value);
        elements.style.value = radius === 0 ? "square" : radius === 100 ? "dot" : "rounded";
      }

      function renderAndPersist() {
        render();
        persistFormState();
      }

      for (const element of [elements.content, elements.color, elements.emailBody, elements.emailSubject, elements.emailTo, elements.logoColor, elements.phoneNumber, elements.size, elements.smsMessage, elements.smsNumber, elements.wifiPassword, elements.wifiSsid]) element.addEventListener("input", renderAndPersist);
      for (const element of [elements.colorMode, elements.contentType, elements.wifiSecurity]) element.addEventListener("change", renderAndPersist);
      elements.cornerRadius.addEventListener("input", () => { syncStyleFromRadius(); renderAndPersist(); });
      elements.style.addEventListener("change", () => {
        if (elements.style.value === "square") elements.cornerRadius.value = "0";
        if (elements.style.value === "rounded" && (Number(elements.cornerRadius.value) === 0 || Number(elements.cornerRadius.value) === 100)) elements.cornerRadius.value = "28";
        if (elements.style.value === "dot") elements.cornerRadius.value = "100";
        renderAndPersist();
      });
      elements.logoFile.addEventListener("change", () => {
        logoFile = elements.logoFile.files?.[0];
        elements.logoStatus.textContent = logoFile ? "Preparing logo…" : "No logo selected";
        persistLogo(logoFile);
        refreshLogo();
      });
      elements.logoColorMode.addEventListener("change", () => { persistFormState(); refreshLogo(); });
      elements.logoColor.addEventListener("input", () => { persistFormState(); refreshLogo(); });
      elements.download.addEventListener("click", downloadSvg);
      elements.downloadPng.addEventListener("click", downloadPng);
      restoreFormState();
      syncStyleFromRadius();
      render();
      restoreLogo();
    </script>
  </body>
</html>
